name: Build resume

on:
  push:
    branches: [main]
    paths: ['*.tex']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume-en.tex
            resume-es.tex

      - name: Commit the compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume-en.pdf resume-es.pdf
          git diff --staged --quiet || git commit -m "chore: rebuild resume PDFs"
          git push
